      tags:
      - 'Admin: users'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '403':
          description: CANNOT_MODIFY_SELF / OWNER_REQUIRED / PERMISSION_DENIED
        '409':
          description: LAST_ADMIN
  /api/v1/admin/users/{id}/resend-invite/:
    post:
