  /api/v1/auth/devices/{id}/:
    delete:
      operationId: auth_devices_destroy
      description: Its next login needs an emailed code again. Doesn't log it out.
      summary: Stop trusting one of my devices
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Auth: trusted devices'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Removed.
        '404':
          description: NOT_FOUND
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Send the Google ID token the frontend got from Google.

        - `status: AUTHENTICATED`: this Google account is already linked. Tokens are returned; you're logged in.
        - `status: OTP_REQUIRED`: first time with this Google account. A 6-digit code was emailed to the Google account's address; call `google/verify/` with the same `id_token` and the code.
      summary: Continue with Google (step 1)
      tags:
      - 'Auth: Google'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSignInResponse'
          description: ''
        '400':
          description: VALIDATION_ERROR / GOOGLE_EMAIL_NOT_VERIFIED
        '401':
          description: GOOGLE_TOKEN_INVALID
        '403':
          description: ACCOUNT_DISABLED
        '429':
          description: OTP_COOLDOWN / OTP_REQUEST_LIMIT_REACHED / THROTTLED
        '503':
          description: GOOGLE_UNAVAILABLE / OTP_DELIVERY_FAILED
  /api/v1/auth/google/unlink/:
    post:
      operationId: auth_google_unlink_create
      description: Google sign-in stops working for this account (email OTP still
        works). Signing in with Google again later will require an email code.
      summary: Unlink my Google account
      tags:
      - 'Auth: Google'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: GOOGLE_NOT_LINKED
  /api/v1/auth/google/verify/:
    post:
      operationId: auth_google_verify_create
      description: Links the Google account to the invited account that owns the email
        and logs in. Later Google sign-ins are one-click. Google never creates accounts.
      summary: 'Continue with Google (step 2: verify the emailed code)'
      tags:
      - 'Auth: Google'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
        '400':
          description: OTP_INVALID / OTP_EXPIRED / GOOGLE_EMAIL_NOT_VERIFIED
        '401':
          description: GOOGLE_TOKEN_INVALID
        '403':
          description: ACCOUNT_DISABLED
        '409':
          description: GOOGLE_ACCOUNT_CONFLICT
        '429':
          description: OTP_ATTEMPTS_EXCEEDED / THROTTLED
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        - Trusted device (this browser passed a code within the last 90 days): `status: AUTHENTICATED`, tokens as for any login.
        - New device: `status: OTP_REQUIRED`, a code is emailed; send it with the returned `login_ticket` to `login/verify/`.

        Any wrong email/password (or an account without a password yet) gives the same `INVALID_CREDENTIALS`. 5 wrong passwords lock the email for 15 minutes (`LOGIN_LOCKED`).
      summary: Log in with email + password
      tags:
      - 'Auth: password'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '400':
          description: VALIDATION_ERROR / INVALID_CREDENTIALS
        '403':
          description: ACCOUNT_DISABLED
        '429':
          description: LOGIN_LOCKED / OTP_REQUEST_LIMIT_REACHED / THROTTLED
        '503':
          description: OTP_DELIVERY_FAILED
  /api/v1/auth/login/resend/:
    post:
      operationId: auth_login_resend_create
      summary: Email a new code for a pending new-device login
      tags:
      - 'Auth: password'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginTicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginTicketRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Code sent.
        '400':
          description: LOGIN_TICKET_INVALID
        '429':
          description: OTP_COOLDOWN / OTP_REQUEST_LIMIT_REACHED
  /api/v1/auth/login/verify/:
    post:
      operationId: auth_login_verify_create
      description: Logs in and trusts this device for 90 days.
      summary: Finish a new-device login with the emailed code
      tags:
      - 'Auth: password'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
        '400':
          description: VALIDATION_ERROR / OTP_INVALID / OTP_EXPIRED / LOGIN_TICKET_INVALID
        '403':
          description: ACCOUNT_DISABLED
        '429':
          description: OTP_ATTEMPTS_EXCEEDED / THROTTLED
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Ends the current session immediately: its access AND refresh tokens
