  /api/v1/admin/enquiries/:
    get:
      operationId: admin_enquiries_list
      description: ?status=NEW|CONTACTED|ACCEPTED|REJECTED  ?search=name/phone/email  ?ordering=created_at
      summary: List enquiries
      parameters:
      - in: query
        name: board
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: standard
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - CONTACTED
          - NEW
          - REJECTED
        description: |-
          * `NEW` - New
          * `CONTACTED` - Contacted
          * `ACCEPTED` - Admitted
          * `REJECTED` - Not proceeding
      tags:
      - 'Admin: enquiries'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminEnquiryList'
          description: ''
