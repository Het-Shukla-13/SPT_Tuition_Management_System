  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Returns a new access token AND a new refresh token; the presented refresh token stops working. Two refreshes with the same token within a short grace window (e.g. two tabs) both receive the same new pair. Re-using an old refresh token after that window ends the whole session (theft protection).

        Browsers: send no body; the refresh token is read from the HttpOnly login cookie, and the `X-Requested-With` header is required. The new refresh token is set as the cookie again.
      summary: Refresh the access token (rotates the refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: TOKEN_NOT_VALID / NO_ACTIVE_ACCOUNT / SESSION_EXPIRED
