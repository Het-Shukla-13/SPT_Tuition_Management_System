    PatchedAcademicYearRequest:
      type: object
      description: |-
        Adds case-insensitive uniqueness checks. DRF can't derive validators from
        the database's Lower(...) constraints, so without this a duplicate would
        reach the database and fail as a 500 instead of a clean 400.

        ci_unique: tuples of field names that must be unique together, ignoring case.
      properties:
        board:
          type: integer
        name:
          type: string
          minLength: 1
          description: e.g. "2026-27"
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          default: false
        is_active:
          type: boolean
    PatchedBoardRequest:
      type: object
      description: |-
        Adds case-insensitive uniqueness checks. DRF can't derive validators from
        the database's Lower(...) constraints, so without this a duplicate would
        reach the database and fail as a 500 instead of a clean 400.

        ci_unique: tuples of field names that must be unique together, ignoring case.
      properties:
        name:
          type: string
          minLength: 1
          description: e.g. Central Board of Secondary Education
          maxLength: 150
        code:
          type: string
          minLength: 1
          description: Short name, e.g. CBSE
          maxLength: 20
        is_active:
          type: boolean
    PatchedChapterRequest:
      type: object
      description: |-
        Adds case-insensitive uniqueness checks. DRF can't derive validators from
        the database's Lower(...) constraints, so without this a duplicate would
        reach the database and fail as a 500 instead of a clean 400.

        ci_unique: tuples of field names that must be unique together, ignoring case.
      properties:
        board:
          type: integer
        standard:
          type: integer
        subject:
          type: integer
        number:
          type: integer
          maximum: 32767
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 200
        is_active:
          type: boolean
    PatchedEnquiryUpdateRequest:
      type: object
