    post:
      operationId: auth_password_reset_create
      description: For a first password (invited users have none) and for a forgotten
        one. The answer is the same whether or not the email has an account.
      summary: 'Set or reset password: email a code'
      tags:
      - 'Auth: password'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Request accepted.
        '429':
          description: OTP_COOLDOWN / OTP_REQUEST_LIMIT_REACHED / THROTTLED
        '503':
          description: OTP_DELIVERY_FAILED
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Sets the password and logs in, trusting this device. Every OTHER
        session and trusted device of the account ends (the old password may be known).
      summary: 'Set or reset password: code + new password'
      tags:
      - 'Auth: password'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
        '400':
          description: 'VALIDATION_ERROR (weak password: errors.new_password) / OTP_INVALID
            / OTP_EXPIRED'
        '403':
          description: ACCOUNT_DISABLED
        '429':
          description: OTP_ATTEMPTS_EXCEEDED / THROTTLED
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
