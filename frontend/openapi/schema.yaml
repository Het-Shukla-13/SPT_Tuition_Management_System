  /api/v1/academics/academic-years/:
    get:
      operationId: academics_academic_years_list
      summary: List academic years
      parameters:
      - in: query
        name: board
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_current
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
    post:
      operationId: academics_academic_years_create
      summary: Create academic year (admin)
      tags:
      - Academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
  /api/v1/academics/academic-years/{id}/:
    get:
