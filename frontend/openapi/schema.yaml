components:
  schemas:
    AcademicChangeReasonEnum:
      enum:
      - PROMOTION
      - REPEAT
      - SCHOOL_CHANGE
      - BOARD_CHANGE
      - CORRECTION
      type: string
      description: |-
        * `PROMOTION` - Promotion to the next standard
        * `REPEAT` - Repeating the same standard
        * `SCHOOL_CHANGE` - Changed school
        * `BOARD_CHANGE` - Changed board
        * `CORRECTION` - Correction of a mistake
    AcademicChangeRequest:
      type: object
      properties:
        board:
          type: integer
        standard:
          type: integer
        school:
          type: integer
        reason:
          $ref: '#/components/schemas/AcademicChangeReasonEnum'
      required:
      - reason
    AcademicHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        academic_year:
          type: string
        board:
          type: string
        standard:
          type: string
        school:
          type: string
        started_on:
          type: string
          format: date
        ended_on:
          type: string
          format: date
          nullable: true
          description: Null = current.
        reason:
          $ref: '#/components/schemas/AcademicHistoryReasonEnum'
      required:
      - academic_year
      - board
      - id
      - reason
      - school
      - standard
      - started_on
    AcademicHistoryReasonEnum:
      enum:
      - ADMISSION
      - PROMOTION
      - REPEAT
      - SCHOOL_CHANGE
      - BOARD_CHANGE
      - CORRECTION
      type: string
      description: |-
        * `ADMISSION` - Admission
        * `PROMOTION` - Promotion to the next standard
        * `REPEAT` - Repeating the same standard
        * `SCHOOL_CHANGE` - Changed school
        * `BOARD_CHANGE` - Changed board
        * `CORRECTION` - Correction of a mistake
    AcademicYear:
      type: object
      description: |-
        Adds case-insensitive uniqueness checks. DRF can't derive validators from
        the database's Lower(...) constraints, so without this a duplicate would
        reach the database and fail as a 500 instead of a clean 400.

        ci_unique: tuples of field names that must be unique together, ignoring case.
      properties:
        id:
          type: integer
          readOnly: true
        board:
          type: integer
        board_code:
          type: string
          readOnly: true
        name:
          type: string
          description: e.g. "2026-27"
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          default: false
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - board
      - board_code
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AcademicYearRequest:
      type: object
      description: |-
        Adds case-insensitive uniqueness checks. DRF can't derive validators from
        the database's Lower(...) constraints, so without this a duplicate would
        reach the database and fail as a 500 instead of a clean 400.

        ci_unique: tuples of field names that must be unique together, ignoring case.
      properties:
        board:
          type: integer
        name:
          type: string
          minLength: 1
          description: e.g. "2026-27"
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          default: false
        is_active:
          type: boolean
      required:
      - board
      - end_date
      - name
      - start_date
    AccessCreateRequest:
      type: object
      description: 'Give a login access: an existing one (user_id) OR a new one (new_login).'
      properties:
        user_id:
          type: integer
        new_login:
          $ref: '#/components/schemas/NewLoginRequest'
    ActionEnum:
      enum:
      - PROMOTE
      - REPEAT
      - LEAVE
      - COMPLETE
      type: string
      description: |-
        * `PROMOTE` - PROMOTE
        * `REPEAT` - REPEAT
        * `LEAVE` - LEAVE
        * `COMPLETE` - COMPLETE
    AdjustmentRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: + adds to what's owed, - reduces it (e.g. a concession).
        reason:
          type: string
          minLength: 1
        visible_to_student:
          type: boolean
          default: true
      required:
      - amount
      - reason
    AdminContactRequest:
      type: object
      description: channel + identifier, with the identifier normalised for its channel.
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        identifier:
          type: string
          nullable: true
          minLength: 1
          description: New email/phone, or null to remove it.
          maxLength: 254
      required:
      - channel
      - identifier
    AdminEnquiry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        student_name:
          type: string
          readOnly: true
        standard:
          type: integer
          readOnly: true
          nullable: true
        standard_name:
          type: string
          readOnly: true
        board:
          type: integer
          readOnly: true
          nullable: true
        board_code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EnquiryStatusEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
          description: Admin-only follow-up notes.
        handled_by:
          type: integer
          readOnly: true
          nullable: true
        student:
          type: integer
          readOnly: true
          nullable: true
          description: Set when the enquiry turned into an admission.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - board
      - board_code
      - created_at
      - email
      - handled_by
      - id
      - message
      - notes
      - parent_name
      - phone
      - standard
      - standard_name
      - status
      - student
      - student_name
      - updated_at
    AdminUser:
      type: object
      description: 'What administrators see about an account. Read-only: changes go
        through actions.'
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        phone:
          type: string
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_by:
          type: integer
          readOnly: true
          nullable: true
          description: Who created this login.
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: First successful login (invite accepted).
        invite_accepted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activated_at
      - created_at
      - email
      - email_verified_at
      - first_name
      - id
      - invite_accepted
      - invited_by
      - is_active
      - is_superuser
      - last_login
      - last_name
      - phone
      - phone_verified_at
      - role
      - updated_at
    AdmissionRequest:
      type: object
      description: The admin's "Add new student" form.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        address:
          type: string
        guardian_name:
          type: string
          maxLength: 150
        guardian_relation:
          type: string
          maxLength: 50
        guardian_phone:
          type: string
          maxLength: 32
        guardian_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        remarks:
          type: string
        board:
          type: integer
        standard:
          type: integer
        school:
          type: integer
        admission_date:
          type: string
          format: date
        subjects:
          type: array
          items:
            type: integer
        link_user_ids:
          type: array
          items:
            type: integer
          description: Existing parent/student logins that should see this student
            (e.g. a sibling's parent).
        new_logins:
          type: array
          items:
            $ref: '#/components/schemas/NewLoginRequest'
          description: New parent/student logins to create, link and invite (SMS/email).
        confirm_duplicate:
          type: boolean
          default: false
          description: Admit even if a similar student exists (after checking the
            warning).
        agreed_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Agreed fee for this academic year. Defaults to the standard's
            fee structure.
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
          description: Dues from before the app (+) or credit (-). Needs opening_balance_reason.
        opening_balance_reason:
          type: string
          default: ''
      required:
      - board
      - first_name
      - last_name
      - school
      - standard
      - subjects
    AdmissionResult:
      type: object
      description: Documentation only.
      properties:
        student:
          $ref: '#/components/schemas/StudentDetail'
        invite_sent:
          type: object
          additionalProperties: {}
          description: 'Per new login id: {email: bool, phone: bool}.'
      required:
      - invite_sent
      - student
    AgreedFeeRequest:
      type: object
      properties:
        agreed_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          minLength: 1
      required:
      - agreed_fee
      - reason
    ArchiveRequest:
      type: object
      properties:
        archived:
          type: boolean
      required:
      - archived
    AssignNoteRequest:
      type: object
      properties:
        student_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 500
          minItems: 1
        remarks:
          type: string
          default: ''
      required:
      - student_ids
    AssignTestRequest:
