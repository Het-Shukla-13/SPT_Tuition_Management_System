      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: OTP_INVALID / OTP_EXPIRED
        '409':
          description: CONTACT_IN_USE
        '429':
          description: OTP_ATTEMPTS_EXCEEDED
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: |-
        Phone login: an SMS code every time. Email logins use `login/` (password) and get `EMAIL_LOGIN_NEEDS_PASSWORD` here.

        Invite-only: accounts are created by the institute, never here. Sends a one-time login code if this phone has an active account; for any other address nothing is sent, and the response is identical either way, so this endpoint can't be used to discover who has an account.

        Limits: one request per identifier per cooldown period, a cap per hour, and a per-IP limit.
      summary: Request a login code (phone only)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Request accepted.
        '400':
          description: VALIDATION_ERROR
        '429':
          description: OTP_COOLDOWN / OTP_REQUEST_LIMIT_REACHED / THROTTLED
        '503':
          description: OTP_DELIVERY_FAILED / OTP_TEMPORARILY_UNAVAILABLE
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Logs into the existing account and returns access + refresh tokens.
        The first successful login activates an invited account.
      summary: Verify an OTP and receive JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
        '400':
          description: VALIDATION_ERROR / OTP_INVALID / OTP_EXPIRED
        '403':
          description: ACCOUNT_DISABLED
        '429':
          description: OTP_ATTEMPTS_EXCEEDED / THROTTLED
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Your other devices are logged out and will need a code next time;
