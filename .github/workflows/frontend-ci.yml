# Frontend checks on every pull request and on pushes to develop-fe / main.

name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [develop-fe, main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (exact versions from the lock file)
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Known vulnerabilities (high and critical)
        run: npm audit --omit=dev --audit-level=high
