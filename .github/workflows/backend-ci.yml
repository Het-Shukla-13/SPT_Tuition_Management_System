# Backend checks on every pull request and on pushes to develop-be / main.
# A PR shouldn't be merged unless this is green.

name: Backend CI

on:
  pull_request:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [develop-be, main]
    paths: ["backend/**", "deploy/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tuition_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://ci:ci@localhost:5432/tuition_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies (exact tested versions)
        run: pip install -r requirements/dev.txt -c requirements/lock.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Django checks and missing migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q
      - name: API schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements/lock.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds
        run: docker build -t tuition-backend:ci .
      - name: Production settings refuse to start without real config
        run: |
          ! docker run --rm tuition-backend:ci python manage.py check 2>/dev/null
      - name: Compose file is valid
        working-directory: deploy
        run: cp .env.example .env && docker compose config -q
