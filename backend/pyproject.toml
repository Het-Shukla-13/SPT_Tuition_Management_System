[project]
name = "spt-tuition-management-backend"
version = "0.1.0"
requires-python = ">=3.12"

# ─── Linting & formatting ────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]  # asserts & dummy secrets are fine in tests
"conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ─── Tests ───────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
